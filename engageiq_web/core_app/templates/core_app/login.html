{% extends 'core_app/base.html' %}
{% block content %}

<div class="auth-container">
    <div class="glass-card auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p style="color: var(--text-secondary); font-size: 0.95rem;">Access the EngageIQ predictive analytical array</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div class="auth-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}"
                           name="{{ field.html_name }}"
                           id="{{ field.id_for_label }}"
                           class="auth-input"
                           placeholder="Enter your credentials" required>
                </div>
            {% endfor %}

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">Log In to Platform</button>
        </form>

        <div class="auth-footer-link">
            New to EngageIQ? <a href="{% url 'register' %}">Create an account</a>
        </div>
    </div>
</div>

{% endblock %}
