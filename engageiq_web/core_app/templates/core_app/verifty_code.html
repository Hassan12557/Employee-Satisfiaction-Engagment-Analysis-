<!-- Display Success/Error Alert Messages -->
{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}" role="alert">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<!-- Your Existing Verification Form -->
<form method="POST" action="">
  {% csrf_token %}
  <label for="code">Enter 6-Digit Code:</label>
  <input type="text" id="code" name="code" required>
  <button type="submit">Verify Account</button>
</form>

<hr>

<!-- Insert directly below your "Verify Account Identity" button -->
<div style="margin-top: 24px; text-align: center;">
  <p style="color: #94a3b8; font-size: 14px; margin-bottom: 10px;">Didn't receive the code?</p>
  <form method="POST" action="{% url 'resend_verification_code' %}">
    {% csrf_token %}
    <button type="submit" style="background: transparent; border: 1px solid #334155; color: #f8fafc; padding: 8px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; transition: all 0.2s;">
      🔄 Resend Verification Code
    </button>
  </form>
</div>
